name: Build Chashma Ghar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Ensure SDK platform 35
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then sdkmanager --install "platforms;android-35" || true; fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then sdkmanager --install "build-tools;35.0.0" || true; fi
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk ChashmaGhar.apk
      - uses: actions/upload-artifact@v4
        with: { name: ChashmaGhar-apk, path: ChashmaGhar.apk, if-no-files-found: error }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Chashma Ghar app (APK)
          body: Download ChashmaGhar.apk and install on your Android phone.
          files: ChashmaGhar.apk
